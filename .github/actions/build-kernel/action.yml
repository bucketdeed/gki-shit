name: 'Build Kernel'
description: 'Builds kernel using legacy build.sh or Bazel (kleaf)'
inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.1)'
    required: true

runs:
  using: composite
  steps:
  - name: Setup Kernel Configs
    if: false
    uses: ./.github/actions/set-kernel-config
  
  - name: 'Build Kernel'
    shell: bash
    working-directory: ${{ github.workspace }}/kernel
    run: |
      sed -i 's/check_defconfig//' ./common/build.config.gki
      if [ -f "build/build.sh" ]; then
        BUILD_GKI_ARTIFACTS="" \
        BUILD_GKI_CERTIFICATION_TOOLS=0 \
        BUILD_SYSTEM_DLKM=0 \
        SKIP_VENDOR_BOOT=1 \
        SKIP_EXT_MODULES=1 \
        SKIP_CP_KERNEL_HDR=1 \
        OUT_DIR="/home/runner/out" \
        LTO=thin \
        BUILD_CONFIG=common/build.config.gki.aarch64 \
        CC="/usr/bin/ccache clang" \
        CXX="/usr/bin/ccache clang++" \
        HOSTCC="/usr/bin/ccache clang" \
        HOSTCXX="/usr/bin/ccache clang++" \
        build/build.sh -j"$(nproc)"
      else
        sed -i '/name = "kernel_aarch64",/a\    check_defconfig = "disabled",' common/BUILD.bazel

        echo "===== Rust Binder configuration ====="
        grep -R "CONFIG_ANDROID_BINDER_IPC_RUST" -n \
          common/arch/arm64/configs/gki_defconfig \
          common/arch/x86/configs/gki_defconfig \
          common/drivers/android/binder/Makefile || true

        echo "===== Rust Binder module declaration ====="
        cat common/drivers/android/binder/Makefile

        echo "===== Expected Rust Binder modules ====="
        grep -n -C 3 "rust_binder.ko" common/modules.bzl || true

        tools/bazel build \
          --config=fast \
          --lto=full \
          --disk_cache=/home/runner/.cache/bazel \
          //common:kernel_aarch64/Image || BUILD_FAILED=1

        echo "===== Generated kernel configs ====="
        find bazel-out -type f \( -name '.config' -o -name 'kernel_config' \) -print 2>/dev/null || true

        echo "===== Rust Binder config anywhere in bazel-out ====="
        grep -R "CONFIG_ANDROID_BINDER_IPC_RUST" bazel-out 2>/dev/null | head -50 || true

        echo "===== rust_binder.ko search ====="
        find bazel-out -type f -name 'rust_binder.ko' -print 2>/dev/null || true

        echo "===== Binder-related modules ====="
        find bazel-out -type f -name '*.ko' 2>/dev/null \
          | grep -Ei 'binder|android' \
          | head -100 || true

        echo "===== rust_binder references ====="
        grep -R "rust_binder" -n common --exclude-dir=.git || true

        if [ "${BUILD_FAILED:-0}" = "1" ]; then
          exit 1
        fi
      fi


  - name: 'Gather Build Artifacts'
    shell: bash
    working-directory: ${{ github.workspace }}/kernel
    run: |
      set -euo pipefail
      if [ -f "bazel-bin/common/kernel_aarch64/Image" ]; then
        echo "Found Image at bazel-bin/common/kernel_aarch64/Image"
        cp "bazel-bin/common/kernel_aarch64/Image" "${{ github.workspace }}/AnyKernel3/Image"
        exit 0
        fi
      if [ -f "/home/runner/out/dist/Image" ]; then
        echo "Found Image at /home/runner/out/dist/Image"
        cp "/home/runner/out/dist/Image" "${{ github.workspace }}/AnyKernel3/Image"
        exit 0
      fi

      exit 1

